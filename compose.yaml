services:
  app:
    build: .
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - receipt-tracker-data:/app/data
      - receipt-tracker-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health', { signal: AbortSignal.timeout(5000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    stop_grace_period: 330s # Allow the 60s OCR request, 240s provider request, and worker cleanup to finish.

volumes:
  receipt-tracker-data:
  receipt-tracker-config:
